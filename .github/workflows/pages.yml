name: Deploy OpenToolHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate data
        run: python3 scripts/validate.py --strict

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Stage site data
        run: python3 scripts/build_site.py

      - name: Verify the Pages artifact
        run: |
          python3 scripts/build_site.py --check
          test -f site/index.html
          test -f site/404.html
          test -f site/data/use-cases.json
          test -f site/data/apis.json
          test -f site/data/catalog.json
          test -f site/schema.json
          test -f site/social-card.png
          test -f site/llms.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
